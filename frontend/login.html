<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="index.css">
    <title>Login</title>
</head>
<body class="page page-register">
    <main class="shell">
        <section class="panel">
            <h1 class="title">Login</h1>
            <p class="subtitle">Access your team workspace.</p>
            <form id="login-form" action="" class="login-form stack" method="post">
                <input class="input" type="email" name="email" placeholder="Email">
                <input class="input" type="password" name="password" placeholder="Password">
                <button class="btn btn-primary" type="submit">Login</button>
            </form>
        </section>
        <button class="btn btn-secondary" id="go-to-register">Don't have an account? Register</button>
        <button class="btn" id="go-to-my-user">Go to my user</button>
    </main>
    <script src="login.js"></script>
</body>
</html>
